version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    rules:
      - path: ^internal/utils/testutils/
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - errcheck
      - path: ^tests/
        linters:
          - errcheck
      - path: internal/storages/s3
        text: "SA1019"
      # The integration suite drives the same aws-sdk-go v1 client the storage
      # uses, so it carries the same deprecation until that port happens.
      - path: ^tests/integration/storages/
        text: "SA1019"
